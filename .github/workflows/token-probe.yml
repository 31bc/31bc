name: token-probe

on:
  workflow_dispatch:

jobs:
  restricted:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Probe repository query (restricted token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Q1 full: stargazers + orderBy STARGAZERS ==="
          gh api graphql -f query='query{user(login:"31bc"){repositories(first:5,ownerAffiliations:[OWNER],orderBy:{field:STARGAZERS,direction:DESC}){totalCount nodes{name stargazers{totalCount}}}}}' 2>&1 || true
          echo ""
          echo "=== Q2 stargazers, no orderBy ==="
          gh api graphql -f query='query{user(login:"31bc"){repositories(first:5,ownerAffiliations:[OWNER]){totalCount nodes{name stargazers{totalCount}}}}}' 2>&1 || true
          echo ""
          echo "=== Q3 orderBy, no stargazers ==="
          gh api graphql -f query='query{user(login:"31bc"){repositories(first:5,ownerAffiliations:[OWNER],orderBy:{field:STARGAZERS,direction:DESC}){totalCount nodes{name}}}}' 2>&1 || true
          echo ""
          echo "=== Q4 plain repositories ==="
          gh api graphql -f query='query{user(login:"31bc"){repositories(first:5){totalCount nodes{name}}}}' 2>&1 || true

  default:
    runs-on: ubuntu-latest
    steps:
      - name: Probe repository query (default token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Q1 full: stargazers + orderBy STARGAZERS ==="
          gh api graphql -f query='query{user(login:"31bc"){repositories(first:5,ownerAffiliations:[OWNER],orderBy:{field:STARGAZERS,direction:DESC}){totalCount nodes{name stargazers{totalCount}}}}}' 2>&1 || true
          echo ""
          echo "=== Q3 orderBy, no stargazers ==="
          gh api graphql -f query='query{user(login:"31bc"){repositories(first:5,ownerAffiliations:[OWNER],orderBy:{field:STARGAZERS,direction:DESC}){totalCount nodes{name}}}}' 2>&1 || true
