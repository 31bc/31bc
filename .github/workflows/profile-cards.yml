name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    name: generate-profile-cards

    steps:
      - uses: actions/checkout@v5

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=github_dark&show_icons=true&include_all_commits=true&custom_title=Mr.shadow%27s%20GitHub%20Stats&show=prs_reviewed&hide=contributed&bg_color=0d1117&title_color=58a6ff&icon_color=8b5cf6&text_color=f0f6fc&label_color=8b949e&border_color=30363d
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=github_dark&layout=compact&langs_count=6&bg_color=0d1117&title_color=58a6ff&text_color=f0f6fc&label_color=8b949e&border_color=30363d
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=dark&background=0d1117&border=30363d&ring=58a6ff&fire=8b5cf6&currStreakNum=58a6ff&sideNums=f0f6fc&currStreakLabel=58a6ff&sideLabels=8b949e&dates=8b949e&stroke=30363d&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=0d1117&border_color=30363d&custom_title=Contribution%20Activity&title_color=58a6ff&color=8b949e&line=58a6ff&point=58a6ff&area=true&area_color=58a6ff&radius=8&height=300
          output_path: profile/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy card
        continue-on-error: true
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: username=${{ github.repository_owner }}&theme=onedark&row=1&column=7
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile/*.svg
          if git commit -m "Update profile cards"; then
            git push
          fi
