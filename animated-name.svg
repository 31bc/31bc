<svg xmlns="http://www.w3.org/2000/svg"
     width="480"
     height="100"
     viewBox="0 0 480 100">

  <style>
    .name {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 2px;
      text-anchor: middle;
      fill: #ff3333;
    }

    .shadow {
      animation: shadowAnim 10s ease-in-out infinite;
      transform-origin: 240px 55px;
    }

    .username {
      animation: userAnim 10s ease-in-out infinite;
      transform-origin: 240px 55px;
    }

    @keyframes shadowAnim {

      /* انتظار البداية */
      0% {
        opacity: 0;
        transform: translateY(5px);
      }

      /* ظهور */
      8% {
        opacity: 1;
        transform: translateY(0);
      }

      /* يبقى */
      38% {
        opacity: 1;
        transform: translateY(0);
      }

      /* اختفاء */
      46% {
        opacity: 0;
        transform: translateY(-3px);
      }

      /* انتظار قبل الرجوع */
      100% {
        opacity: 0;
        transform: translateY(5px);
      }
    }

    @keyframes userAnim {

      /* انتظار Shadow */
      0% {
        opacity: 0;
        transform: translateY(5px);
      }

      46% {
        opacity: 0;
        transform: translateY(5px);
      }

      /* ظهور */
      54% {
        opacity: 1;
        transform: translateY(0);
      }

      /* يبقى */
      84% {
        opacity: 1;
        transform: translateY(0);
      }

      /* اختفاء */
      92% {
        opacity: 0;
        transform: translateY(-3px);
      }

      /* توقف قبل إعادة الحلقة */
      100% {
        opacity: 0;
        transform: translateY(5px);
      }
    }
  </style>

  <text class="name shadow"
        x="240"
        y="62">
    Shadow
  </text>

  <text class="name username"
        x="240"
        y="62">
    31bc
  </text>

</svg>
